metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "70960326bc0a28f2a138d78dede581721136d9469a5cdb506b197be3562f7742"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

# Garage has no S3-style bucket policies for public reads — the only way to
# serve uploaded card images without signed requests is website mode, routed
# by the bucket-name subdomain of root_domain (".localhost" resolves to
# 127.0.0.1 without any /etc/hosts entry). Enabled per-bucket via
# `garage bucket website --allow`; see `just storage-init`.
[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "gazebo-local-dev-admin-token"

[package]
name = "web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "web"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
axum = { version = "0.8.9", optional = true, features = ["multipart"] }
console_error_panic_hook = { version = "0.1.7", optional = true }
console_log = { version = "1.1.0", optional = true }
domain = { path = "../domain", version = "0.1.0", optional = true }
env_logger = { version = "0.11.11", optional = true }
leptos = "0.8.22"
leptos_axum = { version = "0.8.10", optional = true }
leptos_meta = "0.8.7"
leptos_router = "0.8.17"
log = "0.4.34"
rand = { version = "0.10.3", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"], optional = true }
s3 = { version = "0.1.38", default-features = false, optional = true, features = ["async", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls", "uuid"], optional = true }
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"], optional = true }
tower-cookies = { version = "0.11.0", optional = true }
tower-http = { version = "0.7.1", features = ["fs"], optional = true }
uuid = { version = "1.29.0", features = ["serde"] }
wasm-bindgen = "0.2.129"
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaRecorder",
    "MediaRecorderOptions",
    "BlobEvent",
    "Blob",
    "BlobPropertyBag",
    "File",
    "FilePropertyBag",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "FileList",
    "HtmlInputElement",
    "Navigator",
    "Url",
    "Event",
] }

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:console_log",
    "dep:web-sys",
    "dep:js-sys",
    "dep:wasm-bindgen-futures",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:leptos_axum",
    "dep:sqlx",
    "dep:rand",
    "dep:reqwest",
    "dep:serde_json",
    "dep:tower-cookies",
    "dep:env_logger",
    "dep:s3",
    "dep:domain",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[dev-dependencies]
insta = "1.49.0"
wiremock = "0.6.5"

[package.metadata.leptos]
output-name = "web"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
site-addr = "127.0.0.1:3000"
reload-port = 3001
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  neon-branch:
    name: Create/refresh Neon preview branch
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      # Not the action's `db_url` output: GitHub's runner silently drops any
      # step/job output shaped like a credentialed URL ("Skip output 'db_url'
      # since it may contain secret" in the logs), so `db_url` always comes
      # back empty downstream. `db_host` isn't secret and passes through as
      # plain text fine.
      #
      # `db_password` is deliberately NOT exposed as the raw rotated
      # password. This is a documented GitHub Actions bug, not a Neon/Fly
      # issue (see github.com/orgs/community/discussions/25225 — "Combining
      # job outputs with masking leads to empty output"): a value masked
      # here with `::add-mask::` and then set as a job output comes back as
      # an EMPTY STRING when read from another job via
      # `needs.<job>.outputs.<x>`. An empty password in the connection
      # string is exactly "password authentication failed", on the very
      # first attempt, every time — confirmed via Fly's own crash logs and
      # Neon's operations log showing no suspend/credential event anywhere
      # near the failures. This was the actual cause of every crash loop
      # this file's history chased (reset timing, scale-to-zero, retry
      # windows, keep-alive pings — none of it was ever the real problem).
      #
      # `db_password_enc` carries the same password symmetrically encrypted
      # (openssl, keyed on `secrets.NEON_STAGING_API_KEY` — already
      # available to every job without going through an output) rather than
      # just base64-encoded: encoding alone would dodge the masking bug
      # above (the encoded string won't match the registered mask pattern,
      # so it survives the trip) but is trivially reversible, and decrypting
      # a value for the first time in a job means it briefly appears
      # resolved in that step's own "Run" log preview, before the
      # in-script `::add-mask::` call even executes — ciphertext there is
      # harmless, a base64 dump of the real password wouldn't be. Every
      # consumer decrypts it and re-masks the plaintext locally before use
      # (see `deploy-preview` and `e2e`).
      db_host: ${{ steps.reset.outputs.host }}
      db_password_enc: ${{ steps.rotate.outputs.password_enc }}
    steps:
      - name: Create Neon branch (copy-on-write child of `staging`, never prod)
        id: branch
        uses: neondatabase/create-branch-action@v6.4.0
        with:
          project_id: ${{ vars.NEON_STAGING_PROJECT_ID }}
          parent_branch: staging
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_STAGING_API_KEY }}
      # create-branch-action is get-or-create, not reset: a branch left over
      # from an earlier push to this same PR is reused as-is, accumulating
      # whatever app/e2e-test activity that previous run wrote — which once
      # silently ate the whole 4-user signup cap and broke every subsequent
      # CI run for that PR. Resetting unconditionally right after keeps
      # every push starting from a clean copy of `staging`, the same
      # fresh-every-run guarantee the "E2E (local)" job already gets from
      # its own brand-new Postgres container. A no-op on a branch that was
      # *just* created, since it's already at parent state.
      - name: Reset Neon branch to a fresh copy of `staging`
        id: reset
        uses: neondatabase/reset-branch-action@v1
        with:
          project_id: ${{ vars.NEON_STAGING_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          parent: true
          api_key: ${{ secrets.NEON_STAGING_API_KEY }}
      # reset-branch-action's own password output is read back from
      # whatever Neon's control plane has *stored* for this branch's role
      # — but confirmed in practice: it can disagree with the password
      # actually live on the reset branch's data (a reset swaps in a
      # whole copy of staging's storage, and that stored-password
      # bookkeeping isn't guaranteed to follow). Verified this the hard
      # way: a password that connected fine immediately after reset still
      # left every subsequent Fly deploy crash-looping on "password
      # authentication failed" once the branch's compute had cycled
      # (idled, suspended, and resumed). Explicitly resetting the role's
      # password via Neon's own API — rather than trusting a read of
      # whatever it currently has on file — is the one operation Neon
      # guarantees produces a password that's actually, durably correct.
      - name: Rotate neondb_owner's password to one guaranteed correct for the reset branch
        id: rotate
        env:
          NEON_API_KEY: ${{ secrets.NEON_STAGING_API_KEY }}
        run: |
          response=$(curl -sf -X POST \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/${{ vars.NEON_STAGING_PROJECT_ID }}/branches/${{ steps.reset.outputs.branch_id }}/roles/neondb_owner/reset_password")
          password=$(echo "$response" | jq -r '.role.password')
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          # See the `db_password_enc` comment on this job's `outputs:` above
          # for why this leaves encrypted, not as plaintext (or a reversible
          # encoding of it).
          encrypted=$(printf '%s' "$password" | openssl enc -aes-256-cbc -a -A -pbkdf2 -iter 100000 -pass env:NEON_API_KEY)
          echo "password_enc=$encrypted" >> "$GITHUB_OUTPUT"
      # Even a freshly-rotated password isn't necessarily live the instant
      # the API call returns (the response's own `operations` array is
      # Neon's tell that this, too, finishes asynchronously) — so this
      # still doesn't trust it blindly before handing it to Fly.
      - name: Wait until the rotated password actually works
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          url="postgresql://neondb_owner:${{ steps.rotate.outputs.password }}@${{ steps.reset.outputs.host }}/neondb?sslmode=require"
          for attempt in $(seq 1 30); do
            if psql "$url" -c "select 1" >/dev/null 2>&1; then
              echo "rotated credentials are live (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: branch not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "::error::preview/pr-${{ github.event.number }} never became connectable with its rotated credentials"
          exit 1

  deploy-preview:
    name: Deploy Fly preview app
    if: github.event.action != 'closed'
    needs: neon-branch
    runs-on: ubuntu-latest
    steps:
      # Explicit ref, not actions/checkout's default `github.sha`: for a
      # `pull_request` event that default is the ephemeral `refs/pull/N/merge`
      # commit, which GitHub freezes at the moment a run is first *created*
      # and never re-resolves on a re-run — re-running a stale/failed run
      # (rather than letting a fresh push trigger a new one) can silently
      # redeploy an old commit while every run/PR status still points at the
      # current head. Confirmed happening: a re-run deployed a build whose
      # baked-in GH_SHA was a merge of a commit several pushes behind the
      # PR's actual head.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # See the `db_password_enc` comment on `neon-branch`'s `outputs:` —
      # decrypt and re-mask it locally, in this job, before using it; a
      # cross-job `needs.*.outputs.*` read of the raw masked password comes
      # back empty (a documented GitHub Actions bug, not a Neon/Fly issue).
      - name: Decrypt the Neon DB password for use in this job
        id: dbpass
        env:
          NEON_API_KEY: ${{ secrets.NEON_STAGING_API_KEY }}
        run: |
          password=$(printf '%s' "${{ needs.neon-branch.outputs.db_password_enc }}" | openssl enc -d -aes-256-cbc -a -A -pbkdf2 -iter 100000 -pass env:NEON_API_KEY)
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
      - name: Fork a per-PR image bucket and scope a key to it
        id: storage
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_CI_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_CI_SECRET_ACCESS_KEY }}
        run: |
          npm install -g @tigrisdata/cli
          # --endpoint must be passed explicitly: in CI's non-interactive
          # shell the CLI refuses to fall back to its documented default
          # (https://t3.storage.dev) and errors instead of using it.
          tigris configure --access-key "$TIGRIS_ACCESS_KEY_ID" --access-secret "$TIGRIS_SECRET_ACCESS_KEY" --endpoint https://t3.storage.dev

          BUCKET="gazebo-cards-pr-${{ github.event.number }}"
          # Idempotent: a `synchronize` re-run on the same PR may find the
          # fork from an earlier push already exists.
          if ! tigris buckets get "$BUCKET" >/dev/null 2>&1; then
            tigris buckets create "$BUCKET" --fork-of gazebo-cards --access public --yes
          fi

          # Access-key secrets are shown only once at creation, so there's
          # nothing to reuse across pushes — drop any key from a previous
          # push on this PR and mint a fresh one scoped to just this bucket.
          KEY_NAME="gazebo-pr-${{ github.event.number }}"
          EXISTING_KEY_ID="$(tigris access-keys list --json | jq -r --arg n "$KEY_NAME" '.items[] | select(.name==$n) | .id')"
          if [[ -n "$EXISTING_KEY_ID" ]]; then
            tigris access-keys delete "$EXISTING_KEY_ID" --yes
          fi
          eval "$(tigris access-keys create "$KEY_NAME" --bucket "$BUCKET" --role Editor --export --for aws)"
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          {
            echo "S3_ACCESS_KEY=$AWS_ACCESS_KEY_ID"
            echo "S3_SECRET_KEY=$AWS_SECRET_ACCESS_KEY"
          } >> "$GITHUB_ENV"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
      - name: Deploy preview app
        id: deploy
        uses: superfly/fly-pr-review-apps@main
        with:
          name: gazebo-pr-${{ github.event.number }}
          secrets: >
            DATABASE_URL=postgresql://neondb_owner:${{ steps.dbpass.outputs.password }}@${{ needs.neon-branch.outputs.db_host }}/neondb?sslmode=require
            PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            TEST_EMAIL_RECIPIENT=${{ vars.TEST_EMAIL_RECIPIENT }}
            APP_BASE_URL=https://gazebo-pr-${{ github.event.number }}.fly.dev
            INTERNAL_CHECK_TOKEN=${{ secrets.INTERNAL_CHECK_TOKEN }}
            S3_BUCKET=${{ steps.storage.outputs.bucket }}
            S3_ENDPOINT=https://t3.storage.dev
            S3_ACCESS_KEY=${{ env.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ env.S3_SECRET_KEY }}
            S3_PUBLIC_URL=https://${{ steps.storage.outputs.bucket }}.t3.tigrisfiles.io
            S3_REGION=auto
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Set EMAIL_FROM (may contain spaces, which the deploy action's secrets parser can't handle)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # The deploy action reporting success doesn't guarantee Fly's
          # control plane has finished replacing the machine for that
          # deploy yet — hitting this right after can race it and fail
          # with "machine is replacing: concurrent update in progress".
          # Harmless to retry: setting the same secret again is idempotent.
          for attempt in 1 2 3 4 5; do
            if flyctl secrets set --app "gazebo-pr-${{ github.event.number }}" \
              "EMAIL_FROM=${{ vars.EMAIL_FROM }}"; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          exit 1
      - name: Verify email delivery works
        run: |
          # Same class of race as the EMAIL_FROM step above: setting that
          # secret triggers its own machine restart, and this can land in
          # the brief window while it's still replacing — dropping the
          # connection mid-request ("connection closed before message
          # completed") rather than actually reaching the app's own
          # auth/validation logic. A real 401/403/422 still fails after
          # exhausting retries, since curl -f only treats 2xx as success.
          for attempt in 1 2 3 4 5; do
            if curl -sf -H "Authorization: Bearer ${{ secrets.INTERNAL_CHECK_TOKEN }}" \
              "https://gazebo-pr-${{ github.event.number }}.fly.dev/internal/email-check"; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          exit 1
      - name: Verify storage upload works
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -sf -H "Authorization: Bearer ${{ secrets.INTERNAL_CHECK_TOKEN }}" \
              "https://gazebo-pr-${{ github.event.number }}.fly.dev/internal/storage-check"; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          exit 1

  e2e:
    name: Run E2E suite against preview
    if: github.event.action != 'closed'
    needs: [neon-branch, deploy-preview]
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://gazebo-pr-${{ github.event.number }}.fly.dev
    steps:
      # See the matching comment in `deploy-preview` above — same stale-ref
      # risk on a re-run, pinned the same way.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # See the `db_password_enc` comment on `neon-branch`'s `outputs:` —
      # decrypt and re-mask it locally before use; a cross-job
      # `needs.*.outputs.*` read of the raw masked password comes back
      # empty (a documented GitHub Actions bug, not a Neon/Fly issue).
      # Exported via GITHUB_ENV (not a step output) since DATABASE_URL
      # needs to reach later steps — the preview's own Neon branch, which
      # auth.setup.ts connects to directly (same as it does against local
      # Postgres) to clear the test account's daily new-card limit after
      # signing in.
      - name: Decrypt the Neon DB password and set DATABASE_URL
        env:
          NEON_API_KEY: ${{ secrets.NEON_STAGING_API_KEY }}
        run: |
          password=$(printf '%s' "${{ needs.neon-branch.outputs.db_password_enc }}" | openssl enc -d -aes-256-cbc -a -A -pbkdf2 -iter 100000 -pass env:NEON_API_KEY)
          echo "::add-mask::$password"
          echo "DATABASE_URL=postgresql://neondb_owner:${password}@${{ needs.neon-branch.outputs.db_host }}/neondb?sslmode=require" >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install E2E deps and Playwright browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for preview app to wake up
        run: |
          for _ in $(seq 1 20); do
            if curl -sf --max-time 10 "${BASE_URL}/health" >/dev/null 2>&1; then
              echo "preview app is up"
              exit 0
            fi
            echo "waiting for ${BASE_URL}/health..."
            sleep 5
          done
          echo "::error::preview app never became reachable at ${BASE_URL}/health"
          exit 1
      - name: Run E2E suite against the deployed preview
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright traces (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-pr-${{ github.event.number }}
          path: e2e/test-results/
          retention-days: 14

  cleanup:
    name: Tear down preview app + Neon branch
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      # See the matching comment in `deploy-preview` above — same stale-ref
      # risk on a re-run, pinned the same way.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete per-PR Tigris bucket and access key
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_CI_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_CI_SECRET_ACCESS_KEY }}
        run: |
          npm install -g @tigrisdata/cli
          tigris configure --access-key "$TIGRIS_ACCESS_KEY_ID" --access-secret "$TIGRIS_SECRET_ACCESS_KEY" --endpoint https://t3.storage.dev

          KEY_NAME="gazebo-pr-${{ github.event.number }}"
          KEY_ID="$(tigris access-keys list --json | jq -r --arg n "$KEY_NAME" '.items[] | select(.name==$n) | .id')"
          if [[ -n "$KEY_ID" ]]; then
            tigris access-keys delete "$KEY_ID" --yes
          fi
          # `|| true`: fine if deploy-preview never ran for this PR (e.g. it
          # was closed before its first push finished deploying).
          tigris buckets delete "gazebo-cards-pr-${{ github.event.number }}" --yes || true
      - name: Destroy Fly preview app
        uses: superfly/fly-pr-review-apps@main
        with:
          name: gazebo-pr-${{ github.event.number }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Delete Neon preview branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_STAGING_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_STAGING_API_KEY }}

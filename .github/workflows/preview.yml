name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  neon-branch:
    name: Create/refresh Neon preview branch
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      # Not the action's `db_url` output: GitHub's runner silently drops any
      # step/job output shaped like a credentialed URL ("Skip output 'db_url'
      # since it may contain secret" in the logs), so `db_url` always comes
      # back empty downstream. Host and password individually aren't
      # URL-shaped and pass through fine — the full connection string is
      # reassembled inline wherever it's actually needed below.
      db_host: ${{ steps.reset.outputs.host }}
      db_password: ${{ steps.reset.outputs.password }}
    steps:
      - name: Create Neon branch (copy-on-write child of `staging`, never prod)
        id: branch
        uses: neondatabase/create-branch-action@v6.4.0
        with:
          project_id: ${{ vars.NEON_STAGING_PROJECT_ID }}
          parent_branch: staging
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_STAGING_API_KEY }}
      # create-branch-action is get-or-create, not reset: a branch left over
      # from an earlier push to this same PR is reused as-is, accumulating
      # whatever app/e2e-test activity that previous run wrote — which once
      # silently ate the whole 4-user signup cap and broke every subsequent
      # CI run for that PR. Resetting unconditionally right after keeps
      # every push starting from a clean copy of `staging`, the same
      # fresh-every-run guarantee the "E2E (local)" job already gets from
      # its own brand-new Postgres container. A no-op on a branch that was
      # *just* created, since it's already at parent state.
      - name: Reset Neon branch to a fresh copy of `staging`
        id: reset
        uses: neondatabase/reset-branch-action@v1
        with:
          project_id: ${{ vars.NEON_STAGING_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          parent: true
          api_key: ${{ secrets.NEON_STAGING_API_KEY }}
      # reset-branch-action fetches this host/password immediately after
      # the reset call returns, but under the hood a reset is actually a
      # swap-in-new-timeline-and-delete-the-old-one — and the branch's
      # compute doesn't necessarily converge onto that swapped state
      # instantly. Confirmed via Neon's own operation history: on one
      # reset, the swap's own operations reported "finished" nearly 100s
      # before Neon's post-reset check_availability operation even
      # started. Handing Fly a password before that convergence completes
      # is exactly what made every preview deploy crash-loop on "password
      # authentication failed" — so don't trust the action's output until
      # a real connection with it actually succeeds.
      - name: Wait until the reset branch's credentials actually work
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          url="postgresql://neondb_owner:${{ steps.reset.outputs.password }}@${{ steps.reset.outputs.host }}/neondb?sslmode=require"
          for attempt in $(seq 1 30); do
            if psql "$url" -c "select 1" >/dev/null 2>&1; then
              echo "branch credentials are live (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: branch not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "::error::preview/pr-${{ github.event.number }} never became connectable with its post-reset credentials"
          exit 1

  deploy-preview:
    name: Deploy Fly preview app
    if: github.event.action != 'closed'
    needs: neon-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fork a per-PR image bucket and scope a key to it
        id: storage
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_CI_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_CI_SECRET_ACCESS_KEY }}
        run: |
          npm install -g @tigrisdata/cli
          # --endpoint must be passed explicitly: in CI's non-interactive
          # shell the CLI refuses to fall back to its documented default
          # (https://t3.storage.dev) and errors instead of using it.
          tigris configure --access-key "$TIGRIS_ACCESS_KEY_ID" --access-secret "$TIGRIS_SECRET_ACCESS_KEY" --endpoint https://t3.storage.dev

          BUCKET="gazebo-cards-pr-${{ github.event.number }}"
          # Idempotent: a `synchronize` re-run on the same PR may find the
          # fork from an earlier push already exists.
          if ! tigris buckets get "$BUCKET" >/dev/null 2>&1; then
            tigris buckets create "$BUCKET" --fork-of gazebo-cards --access public --yes
          fi

          # Access-key secrets are shown only once at creation, so there's
          # nothing to reuse across pushes — drop any key from a previous
          # push on this PR and mint a fresh one scoped to just this bucket.
          KEY_NAME="gazebo-pr-${{ github.event.number }}"
          EXISTING_KEY_ID="$(tigris access-keys list --json | jq -r --arg n "$KEY_NAME" '.items[] | select(.name==$n) | .id')"
          if [[ -n "$EXISTING_KEY_ID" ]]; then
            tigris access-keys delete "$EXISTING_KEY_ID" --yes
          fi
          eval "$(tigris access-keys create "$KEY_NAME" --bucket "$BUCKET" --role Editor --export --for aws)"
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          {
            echo "S3_ACCESS_KEY=$AWS_ACCESS_KEY_ID"
            echo "S3_SECRET_KEY=$AWS_SECRET_ACCESS_KEY"
          } >> "$GITHUB_ENV"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
      - name: Deploy preview app
        id: deploy
        uses: superfly/fly-pr-review-apps@main
        with:
          name: gazebo-pr-${{ github.event.number }}
          secrets: >
            DATABASE_URL=postgresql://neondb_owner:${{ needs.neon-branch.outputs.db_password }}@${{ needs.neon-branch.outputs.db_host }}/neondb?sslmode=require
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            TEST_EMAIL_RECIPIENT=${{ vars.TEST_EMAIL_RECIPIENT }}
            APP_BASE_URL=https://gazebo-pr-${{ github.event.number }}.fly.dev
            INTERNAL_CHECK_TOKEN=${{ secrets.INTERNAL_CHECK_TOKEN }}
            S3_BUCKET=${{ steps.storage.outputs.bucket }}
            S3_ENDPOINT=https://t3.storage.dev
            S3_ACCESS_KEY=${{ env.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ env.S3_SECRET_KEY }}
            S3_PUBLIC_URL=https://${{ steps.storage.outputs.bucket }}.t3.tigrisfiles.io
            S3_REGION=auto
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Set EMAIL_FROM (may contain spaces, which the deploy action's secrets parser can't handle)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # The deploy action reporting success doesn't guarantee Fly's
          # control plane has finished replacing the machine for that
          # deploy yet — hitting this right after can race it and fail
          # with "machine is replacing: concurrent update in progress".
          # Harmless to retry: setting the same secret again is idempotent.
          for attempt in 1 2 3 4 5; do
            if flyctl secrets set --app "gazebo-pr-${{ github.event.number }}" \
              "EMAIL_FROM=${{ vars.EMAIL_FROM }}"; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          exit 1
      - name: Verify email delivery works
        run: |
          # Same class of race as the EMAIL_FROM step above: setting that
          # secret triggers its own machine restart, and this can land in
          # the brief window while it's still replacing — dropping the
          # connection mid-request ("connection closed before message
          # completed") rather than actually reaching the app's own
          # auth/validation logic. A real 401/403/422 still fails after
          # exhausting retries, since curl -f only treats 2xx as success.
          for attempt in 1 2 3 4 5; do
            if curl -sf -H "Authorization: Bearer ${{ secrets.INTERNAL_CHECK_TOKEN }}" \
              "https://gazebo-pr-${{ github.event.number }}.fly.dev/internal/email-check"; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          exit 1
      - name: Verify storage upload works
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -sf -H "Authorization: Bearer ${{ secrets.INTERNAL_CHECK_TOKEN }}" \
              "https://gazebo-pr-${{ github.event.number }}.fly.dev/internal/storage-check"; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          exit 1

  e2e:
    name: Run E2E suite against preview
    if: github.event.action != 'closed'
    needs: [neon-branch, deploy-preview]
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://gazebo-pr-${{ github.event.number }}.fly.dev
      # The preview's own Neon branch — auth.setup.ts connects to it
      # directly (same as it does against local Postgres) to clear the
      # test account's daily new-card limit after signing in.
      DATABASE_URL: postgresql://neondb_owner:${{ needs.neon-branch.outputs.db_password }}@${{ needs.neon-branch.outputs.db_host }}/neondb?sslmode=require
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install E2E deps and Playwright browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for preview app to wake up
        run: |
          for _ in $(seq 1 20); do
            if curl -sf --max-time 10 "${BASE_URL}/health" >/dev/null 2>&1; then
              echo "preview app is up"
              exit 0
            fi
            echo "waiting for ${BASE_URL}/health..."
            sleep 5
          done
          echo "::error::preview app never became reachable at ${BASE_URL}/health"
          exit 1
      - name: Run E2E suite against the deployed preview
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright traces (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-pr-${{ github.event.number }}
          path: e2e/test-results/
          retention-days: 14

  cleanup:
    name: Tear down preview app + Neon branch
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete per-PR Tigris bucket and access key
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_CI_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_CI_SECRET_ACCESS_KEY }}
        run: |
          npm install -g @tigrisdata/cli
          tigris configure --access-key "$TIGRIS_ACCESS_KEY_ID" --access-secret "$TIGRIS_SECRET_ACCESS_KEY" --endpoint https://t3.storage.dev

          KEY_NAME="gazebo-pr-${{ github.event.number }}"
          KEY_ID="$(tigris access-keys list --json | jq -r --arg n "$KEY_NAME" '.items[] | select(.name==$n) | .id')"
          if [[ -n "$KEY_ID" ]]; then
            tigris access-keys delete "$KEY_ID" --yes
          fi
          # `|| true`: fine if deploy-preview never ran for this PR (e.g. it
          # was closed before its first push finished deploying).
          tigris buckets delete "gazebo-cards-pr-${{ github.event.number }}" --yes || true
      - name: Destroy Fly preview app
        uses: superfly/fly-pr-review-apps@main
        with:
          name: gazebo-pr-${{ github.event.number }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Delete Neon preview branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_STAGING_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_STAGING_API_KEY }}

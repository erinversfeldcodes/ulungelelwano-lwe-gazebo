[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# This workspace is private (publish = false on every member) and never
# distributed as a crate, so there's nothing to license — skip the check
# for our own crates rather than fabricate an SPDX expression for them.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
ignore = [
    # `paste` (unmaintained, RUSTSEC-2024-0436) comes in transitively via
    # leptos's `either_of`, with no safe upgrade available from our side —
    # it's a tiny proc-macro helper, not a live security exposure. Revisit
    # when leptos drops it.
    "RUSTSEC-2024-0436",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
